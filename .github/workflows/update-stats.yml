name: Update profile stats

on:
  schedule:
    # tous les lundis à 04:17 UTC (heure décalée : les runners sont moins chargés)
    - cron: '17 4 * * 1'
  workflow_dispatch:        # bouton "Run workflow" pour déclencher à la main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect GitHub data
        env:
          # STATS_TOKEN = PAT classique, scopes repo + read:org + read:user.
          # Le GITHUB_TOKEN natif d'Actions ne voit QUE ce dépôt : il ne suffit pas.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          mkdir -p data
          # --name-top 10 : seuls les 10 premiers de chaque classement gardent
          # leur vrai nom. Ce sont exactement ceux que la carte affiche.
          python3 scripts/collect.py --name-top 10 --out data/github-profile.json

      - name: Safety check — refuse to publish a private name outside the whitelist
        run: |
          python3 - <<'PY'
          import json, sys
          NAME_TOP = 10
          d = json.load(open('data/github-profile.json'))
          named = set(d.get('named_repos') or [])

          if d.get('naming_mode') != 'whitelist':
              sys.exit("ABORT: naming_mode=%r, expected 'whitelist'." % d.get('naming_mode'))

          # Tout repo prive hors liste blanche doit porter un identifiant anonyme.
          leaked = [r['id'] for r in d['repos']
                    if r['private'] and r['id'] not in named
                    and not r['id'].startswith('private-')]
          if leaked:
              sys.exit('ABORT: %d private repo names outside the whitelist.' % len(leaked))

          # Un nom prive publie doit se justifier : soit le depot figure au
          # classement que la carte affiche, soit il est actif. Un plafond
          # chiffre ne dirait plus rien maintenant que la fenetre d'activite
          # ouvre la liste — cette regle-la, si.
          priv_named = [r['id'] for r in d['repos'] if r['private'] and r['id'] in named]
          top_ids = {r['id'] for r in sorted(d['repos'],
                                             key=lambda x: x.get('my_commits') or 0,
                                             reverse=True)[:NAME_TOP]}
          active = set(d.get('active_repos') or [])
          unjustified = [i for i in priv_named if i not in top_ids and i not in active]
          if unjustified:
              sys.exit('ABORT: %d private names neither ranked nor active: %s'
                       % (len(unjustified), sorted(unjustified)[:5]))
          print("OK \u2014 %d repos, %d private." % (d['totals']['repos'], d['totals']['private']))
          print("     %d real names published, of which %d private." % (len(named), len(priv_named)))
          print("     active window: %s, %d repositories in it."
                % (d.get('active_since'), len(active)))

          # Un depot anonyme ne doit conserver aucun champ qui le trahirait.
          STRIPPED = ('description', 'homepage', 'topics', 'readme', 'structure')
          bleeding = [r['id'] for r in d['repos']
                      if r['id'].startswith('private-')
                      and any(r.get(f) for f in STRIPPED)]
          if bleeding:
              sys.exit('ABORT: %d anonymised repos kept identifying fields: %s'
                       % (len(bleeding), bleeding[:5]))
          print("     anonymised repos carry no README, description or topics.")
          PY

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Render SVG cards
        run: python3 scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
