name: Update profile stats

on:
  schedule:
    # tous les lundis à 04:17 UTC (heure décalée : les runners sont moins chargés)
    - cron: '17 4 * * 1'
  workflow_dispatch:        # bouton "Run workflow" pour déclencher à la main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect GitHub data
        env:
          # STATS_TOKEN = PAT classique, scopes repo + read:org + read:user.
          # Le GITHUB_TOKEN natif d'Actions ne voit QUE ce dépôt : il ne suffit pas.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          mkdir -p data
          python3 scripts/collect.py --out data/github-profile.json

      - name: Safety check — refuse to continue if anonymisation is off
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data/github-profile.json'))
          if not d.get('anonymized'):
              sys.exit('ABORT: data is not anonymised, private repo names would leak.')
          leaked = [r['id'] for r in d['repos'] if r['private'] and not r['id'].startswith('private-')]
          if leaked:
              sys.exit(f'ABORT: {len(leaked)} private repo names present.')
          print(f"OK — {d['totals']['repos']} repos, {d['totals']['private']} private, all anonymised.")
          PY

      - name: Render SVG cards
        run: python3 scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
